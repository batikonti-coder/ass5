<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 | Part 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #hover-box {
            height: 150px;
            background-color: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">JS Assignment 5</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Part 1: Intro</a></li>
                    <li class="nav-item"><a class="nav-link" href="part2.html">Part 2: DOM</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part3.html">Part 3: Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="part4.html">Part 4: To-Do App</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container">
        <h2 class="text-center mb-5">Part 3: Events</h2>
        
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3">
                    <h5 class="fw-bold">Task 5: Mouse Events</h5>
                    <hr>
                    <div id="hover-box">
                        Hover over me!
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3">
                    <h5 class="fw-bold">Task 6: Keyboard Events</h5>
                    <hr>
                    <label class="form-label">Type something:</label>
                    <input type="text" id="live-input" class="form-control mb-3" placeholder="Start typing...">
                    <div class="p-3 bg-light border rounded">
                        <strong>Live Output:</strong> 
                        <span id="live-output" class="text-primary"></span>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3">
                    <h5 class="fw-bold">Task 7: Calculator</h5>
                    <hr>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <input type="number" id="num1" class="form-control" placeholder="Number 1">
                        </div>
                        <div class="col-6">
                            <input type="number" id="num2" class="form-control" placeholder="Number 2">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <button id="btn-add" class="btn btn-primary fw-bold" style="width: 22%;">+</button>
                        <button id="btn-sub" class="btn btn-primary fw-bold" style="width: 22%;">-</button>
                        <button id="btn-mul" class="btn btn-primary fw-bold" style="width: 22%;">*</button>
                        <button id="btn-div" class="btn btn-primary fw-bold" style="width: 22%;">/</button>
                    </div>
                    <div class="alert alert-success m-0 text-center fw-bold fs-5">
                        Result: <span id="calc-result">0</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="part3.js"></script>
</body>
</html>
