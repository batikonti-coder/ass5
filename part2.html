<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 | Part 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #style-box {
            width: 100%;
            height: 150px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">JS Assignment 5</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Part 1: Intro</a></li>
                    <li class="nav-item"><a class="nav-link active" href="part2.html">Part 2: DOM</a></li>
                    <li class="nav-item"><a class="nav-link" href="part3.html">Part 3: Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="part4.html">Part 4: To-Do App</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container">
        <h2 class="text-center mb-5">Part 2: DOM Manipulation</h2>
        
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3">
                    <h5 class="fw-bold">Task 2: Changing Content</h5>
                    <hr>
                    <p id="content-text">This is the original paragraph text.</p>
                    <button id="btn-change-text" class="btn btn-primary mt-auto">Change Text</button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3">
                    <h5 class="fw-bold">Task 3: Changing Styles</h5>
                    <hr>
                    <div id="style-box" class="mb-3">
                        <span id="box-text">Style me!</span>
                    </div>
                    <div class="d-flex gap-2 mt-auto">
                        <button id="btn-change-bg" class="btn btn-warning w-50">Change Color</button>
                        <button id="btn-change-font" class="btn btn-info w-50 text-white">Change Font</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm p-3">
                    <h5 class="fw-bold">Task 4: Elements</h5>
                    <hr>
                    <ul id="item-list" class="list-group mb-3">
                        <li class="list-group-item">Initial Item</li>
                    </ul>
                    <div class="d-flex gap-2 mt-auto">
                        <button id="btn-add-item" class="btn btn-success w-50">Add Item</button>
                        <button id="btn-remove-item" class="btn btn-danger w-50">Remove Item</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="part2.js"></script>
</body>
</html>
